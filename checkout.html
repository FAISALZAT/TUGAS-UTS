<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan | Ruang Baca</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="checkout">

    <main>
        <div class="page-heading">
            <div>
                <p class="eyebrow">SELANGKAH LEBIH DEKAT</p>
                <h1>Bacaanmu, pilihanmu.</h1>
                <p class="muted">
                    Atur pesanan dan lengkapi informasi pengiriman.
                </p>
            </div>

            <a href="stok.html" class="text-link">
                + Tambah buku
            </a>
        </div>

        <div class="checkout-layout">
            <div>
                <section class="panel">
                    <div class="section-title">
                        <h2>Keranjang buku</h2>
                        <span class="tag" id="cart-count"></span>
                    </div>

                    <div id="cart-items"></div>
                </section>

                <section class="panel">
                    <p class="eyebrow">INFORMASI PEMESAN</p>
                    <h2>Ke mana buku dikirim?</h2>

                    <form id="checkout-form">
                        <div class="form-grid">
                            <label>
                                Nama lengkap
                                <input name="nama" placeholder="Nama penerima" autocomplete="name" maxlength="100"
                                    required>
                            </label>

                            <label>
                                Email
                                <input name="email" type="email" placeholder="nama@email.com" autocomplete="email"
                                    required>
                            </label>

                            <label>
                                Nomor telepon
                                <input name="telepon" type="tel" placeholder="08xxxxxxxxxx" pattern="[0-9+ ()\-]{8,20}"
                                    autocomplete="tel" required>
                            </label>

                            <label>
                                Ekspedisi
                                <select name="ekspedisi">
                                    <option>JNE</option>
                                    <option>Pos Indonesia</option>
                                    <option>J&amp;T Express</option>
                                </select>
                            </label>

                            <label class="full">
                                Alamat lengkap
                                <textarea name="alamat" placeholder="Jalan, nomor rumah, kecamatan, kota, kode pos"
                                    autocomplete="street-address" minlength="10" maxlength="500" required></textarea>
                            </label>

                            <label class="full">
                                Metode pembayaran
                                <select name="pembayaran">
                                    <option>Transfer Bank BCA</option>
                                    <option>Transfer Bank Mandiri</option>
                                    <option>Bayar di Tempat (COD)</option>
                                </select>
                            </label>
                        </div>
                    </form>
                </section>
            </div>

            <aside class="panel summary">
                <p class="eyebrow">RINGKASAN</p>
                <h2>Pesanan kamu</h2>

                <div id="totals"></div>

                <button class="button wide" type="submit" form="checkout-form">
                    Buat pesanan →
                </button>

                <p class="small muted">
                    Simulasi tugas UTS. Tidak ada pembayaran atau
                    pengiriman sungguhan.
                </p>
            </aside>
        </div>
    </main>

    <script src="data.js"></script>
    <script src="layout.js"></script>
    <script src="script.js"></script>
</body>

</html>
